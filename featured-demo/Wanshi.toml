[wanshi]
trees = "trees"
assets = "assets"
base-url = "/"
theme-lock = true
themes = []

[toc]
placement = "right"
sticky = true
mobile-sticky = true
max-width = "max-content"

[text]
edit = "[edit]"
toc = "Table of Contents"
references = "References"
backlinks = "Backlinks"
search = "Search  /"

[build]
typst-root = "trees"
short-slug = false
pretty-urls = false
# `link` lists referenced notes by title. `guide/links` overrides this to
# `embed` for itself, so the two renderings can be compared side by side.
footer-mode = "link"
footer-sort-by = "slug"
inline-css = false
inline-script = false
# Left off deliberately: with `asref = true` every linked note becomes a
# citation. This forest instead marks individual notes with `"asref": "true"`,
# which is what `refs/` demonstrates.
asref = false
output = "./publish"
search = true
search-content = true
# Which metadata keys print under a title, in this order. Everything else stays
# in `wanshi.json` and still sorts and filters, it just is not shown. The
# defaults are `date` and `author`; `status` and `see-also` are added here so
# `guide/metadata` can demonstrate custom keys, including a rich one.
header-keys = ["date", "author", "status", "see-also"]

[serve]
edit = "vscode://file/"
output = "./.cache/publish"
command = ["miniserve", "<output>", "--index", "index.html", "--pretty-urls", "--port", "8087"]

[publish]
# Off because a feed needs an absolute `base-url` to be useful, and this demo
# uses "/" so it can be previewed locally. To try it: set both.
rss = false
