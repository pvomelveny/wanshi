[wanshi]
trees = "trees"
assets = "assets"
base-url = "/"
theme-lock = true
themes = []

[toc]
placement = "right"
sticky = true
mobile-sticky = true
# A length, so the column and the sidebar in it are the same width. With
# `max-content` the sidebar shrank to its longest entry while the page went on
# reserving the full column, which left 345px of nothing beside the outline on
# every short page in this forest.
max-width = "35rem"

[text]
edit = "[edit]"
toc = "Table of Contents"
references = "References"
backlinks = "Backlinks"
embedded-by = "Found in"
search = "Search  /"

[build]
typst-root = "trees"
short-slug = false
pretty-urls = false
# `link` lists referenced notes by title. `guide/links` overrides this to
# `embed` for itself, so the two renderings can be compared side by side.
footer-mode = "link"
footer-sort-by = "slug"
inline-css = false
inline-script = false
# Left off deliberately: with `asref = true` every linked note becomes a
# citation. This forest instead marks individual notes with `"asref": "true"`,
# which is what `refs/` demonstrates.
asref = false
# Off site-wide. `math/fixed-point` turns it on for itself with a `numbering`
# key, which is how one worked example can be numbered while the guide is not.
numbering = false
output = "./publish"
search = true
search-content = true
# Which metadata keys print under a title, in this order. Everything else stays
# in `wanshi.json` and still sorts and filters, it just is not shown. `date`,
# `author` and `see-also` are the defaults; `status` is added here so
# `guide/metadata` can demonstrate a key that is not shown by default.
header-keys = ["date", "author", "see-also", "status"]

[refs]
# `wanshi refs sync` reads this and writes a note for every work cited under
# `dir` that does not have one yet. The file sits under a `_` directory so
# section discovery skips it, while staying reachable from a note as
# `#bibliography("/_bib/refs.bib")` should one want Typst's own citations.
bibliography = "trees/_bib/refs.bib"
dir = "refs"

[serve]
edit = "vscode://file/"
output = "./.cache/publish"
command = ["miniserve", "<output>", "--index", "index.html", "--pretty-urls", "--port", "8087"]

[publish]
# Off because a feed needs an absolute `base-url` to be useful, and this demo
# uses "/" so it can be previewed locally. To try it: set both.
rss = false
